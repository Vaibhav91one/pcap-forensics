[project]
name = "pcap-doctor"
version = "0.8.0"
description = "Offline pcap/pcapng triage: flows, negotiated crypto, weak-cipher and plaintext-exposure detection, Markdown+JSON reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "scapy>=2.5",
]

[project.urls]
Homepage = "https://github.com/doctor-labs/pcap-doctor"
Repository = "https://github.com/doctor-labs/pcap-doctor"
Issues = "https://github.com/doctor-labs/pcap-doctor/issues"
Changelog = "https://github.com/doctor-labs/pcap-doctor/blob/main/CHANGELOG.md"
Documentation = "https://github.com/doctor-labs/pcap-doctor#readme"

[project.scripts]
pcap-doctor = "pcap_doctor.cli:app"
pf = "pcap_doctor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcap_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src/pcap_doctor"]
strict = true
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["scapy.*"]
ignore_missing_imports = true

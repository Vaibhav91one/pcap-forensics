name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark
          echo "tshark.soversion.use=gboolean" | sudo tee -a /etc/tshark/tshark.conf
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Environment check
        run: uv run pf doctor
      - name: Fetch regression corpus
        run: ./scripts/fetch_captures.sh
      - name: Fixtures are reproducible
        run: |
          make fixtures
          git diff --exit-code tests/fixtures || (echo "fixtures drifted; commit the regenerated files" && exit 1)
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Typecheck
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Reports render end to end
        run: |
          for cap in captures/*.pcap captures/*.pcapng; do
            .venv/bin/pf analyze "$cap" --out /tmp/pf-ci --quiet || true
          done
          test -s /tmp/pf-ci/report.json
          test -s /tmp/pf-ci/04-diagrams.md

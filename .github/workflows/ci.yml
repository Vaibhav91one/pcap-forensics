name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          tshark --version | head -1
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Environment check
        run: uv run pcap-doctor doctor
      - name: Fetch regression corpus
        run: ./scripts/fetch_captures.sh
      - name: Fixtures are reproducible
        run: |
          make fixtures
          static=$(.venv/bin/python -c "import sys; sys.path.insert(0, 'scripts'); import make_fixtures as m; print(' '.join('tests/fixtures/' + n for n in m.STATIC_FIXTURES))")
          git diff --exit-code -- $static || (echo "byte-built fixtures drifted; commit the regenerated files" && exit 1)
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Typecheck
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Clipboard really copies on Ubuntu (xclip and xsel under Xvfb)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xclip xsel xvfb
          PCAP_DOCTOR_REQUIRE_X11=1 xvfb-run -a .venv/bin/python -m pytest -q -o addopts="" tests/test_clipboard.py -k x11
      - name: Clipboard really copies under Wayland (wl-copy in a headless sway) (#129)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sway wl-clipboard
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null > sway.log 2>&1 &
          for i in $(seq 1 50); do ls "$XDG_RUNTIME_DIR"/wayland-* > /dev/null 2>&1 && break; sleep 0.2; done
          export WAYLAND_DISPLAY="$(basename "$(ls "$XDG_RUNTIME_DIR"/wayland-* | grep -v '\.lock$' | head -1)")"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"; tail -5 sway.log
          test -n "$WAYLAND_DISPLAY" || { echo "sway did not start"; cat sway.log; exit 1; }
          PCAP_DOCTOR_REQUIRE_WAYLAND=1 .venv/bin/python -m pytest -q -o addopts="" tests/test_clipboard.py -k wayland
      - name: Same findings as macOS and Windows, and a clipboard round trip (#108)
        run: PATH="$PWD/.venv/bin:$PATH" xvfb-run -a .venv/bin/python scripts/portability_check.py
      - name: watch captures live traffic on loopback (#128)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sudo .venv/bin/pcap-doctor watch -i lo --seconds 5 --dir /tmp/pf-watch > /tmp/pf-watch.log 2>&1 &
          watcher=$!
          sleep 3
          for i in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:8765/?n=$i" || true; sleep 0.5; done
          sleep 8
          sudo pkill -INT -f "[p]ython.*pcap-doctor watch"  # the watch process itself, not the sudo wrapper
          for i in $(seq 1 60); do kill -0 "$watcher" 2>/dev/null || break; sleep 1; done
          cat /tmp/pf-watch.log
          grep -q "HTTP_CLEARTEXT" /tmp/pf-watch.log
          grep -q "^stopped:" /tmp/pf-watch.log
          ! pgrep -x dumpcap
      - name: Reports render end to end
        run: |
          for cap in captures/*.pcap captures/*.pcapng; do
            .venv/bin/pcap-doctor analyze "$cap" --out /tmp/pf-ci --quiet || true
          done
          test -s /tmp/pf-ci/report.json
          test -s /tmp/pf-ci/04-diagrams.md

  npm-launcher:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"] # 22 is what the release job uses (#96)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Launcher tests
        working-directory: npm
        run: npm test

  portability:
    # pcap-doctor on macOS and Windows: tshark from the OS package manager, the same findings as Linux on
    # every fixture, a real clipboard round trip, and (macOS) the whole test suite (#108).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark (macOS)
        if: runner.os == 'macOS'
        run: brew install wireshark
      - name: Install tshark (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install wireshark -y --no-progress
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pcap-doctor
        run: python -m pip install -e ".[dev]"
      - name: Same findings as Linux, and a real clipboard round trip
        run: python scripts/portability_check.py
      - name: Full test suite (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest -q

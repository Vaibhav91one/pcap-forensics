name: release

# Publishes to PyPI when a version tag is pushed (issue #50), then the npm launcher (issue #51).
# Both use trusted publishing (OIDC): no token or secret exists for either registry (#93).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version v$version"
            exit 1
          fi
          npm_version=$(node -p "require('./npm/package.json').version")
          if [ "$npm_version" != "$version" ]; then
            echo "npm/package.json version $npm_version does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pcap-doctor
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing: GitHub proves the workflow's identity; provenance is automatic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (needs 11.5.1+)
        run: npm install -g npm@latest
      - name: Launcher tests
        working-directory: npm
        run: npm test
      - name: Publish unless the package is new or this version is already on npm
        working-directory: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if ! versions=$(npm view pcap-doctor versions --json 2>&1); then
            if grep -q E404 <<< "$versions"; then
              echo "::notice::pcap-doctor is not on npm yet. A trusted publisher can only be added to an existing package: publish it once by hand (cd npm && npm login && npm publish --access public), then add this workflow as its trusted publisher."
              exit 0
            fi
            echo "$versions"
            exit 1
          fi
          if node -e 'process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)' "$versions" "$version"; then
            echo "::notice::pcap-doctor@$version is already on npm; nothing to publish."
            exit 0
          fi
          npm publish --access public
